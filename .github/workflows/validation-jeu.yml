name: Validation du jeu autonome
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jeu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/construire-jeu.mjs
      - name: Vérifier que les HTML livrés correspondent aux sources
        run: git diff --exit-code -- dist/index.html dist/artefact.html
      - run: npm run test:jeu
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node jeu/tests/mobile.cjs
      - run: node jeu/tests/rendu.cjs
      - run: node jeu/tests/chai-plan.cjs
      - run: for test in jeu/tests/finitions/*.test.cjs jeu/tests/pigeonnier/*.test.cjs jeu/tests/veillee/*.test.cjs jeu/tests/lot50/*.test.cjs jeu/tests/serie20/*.test.cjs; do node "$test" || exit 1; done
      - run: node jeu/tests/ulysse-entree.cjs
      - run: node jeu/tests/firmin-portrait.cjs
      - run: node jeu/tests/domaine.cjs
      - run: node jeu/tests/domaine-vivant.cjs
      - run: node jeu/tests/dynamiques-depart.cjs
      - run: node jeu/tests/empatage-vivant.cjs
      - run: node jeu/tests/filtration-vivante.cjs
      - run: node jeu/tests/carnet.cjs
      - run: node jeu/tests/recette-mobile.cjs
      - run: node jeu/tests/parcours.cjs
      - run: GESTES_REELS=1 CAPTURE_DIR=qa/captures/gestes node jeu/tests/parcours.cjs
      - run: ULYSSE_REEL=1 CAPTURE_DIR=qa/captures/ulysse node jeu/tests/parcours.cjs
      - run: MODE_JEU=debutant ULYSSE_REEL=1 CAPTURE_DIR=qa/captures/ulysse-debutant node jeu/tests/parcours.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jeu-et-verification-mobile
          path: |
            dist/index.html
            qa/captures/
            docs/captures/domaine-vivant/
            docs/captures/empatage-vivant/
            docs/captures/filtration-vivante/
            docs/captures/serie/
            docs/captures/lot50/
            docs/captures/serie20/
            docs/captures/houblon-preparation/
            docs/captures/houblon-oubli/
            docs/captures/chai-plan-*.png
            docs/captures/ulysse-entree-*.png
            docs/captures/firmin-portrait-*.png
