name: Validation du jeu autonome
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jeu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/construire-jeu.mjs
      - run: npm run test:jeu
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node jeu/tests/mobile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jeu-et-verification-mobile
          path: |
            dist/index.html
            qa/captures/
