name: Publier le jeu sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'jeu/**'
      - 'data/**'
      - 'scripts/construire-jeu.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'jeu/**'
      - 'data/**'
      - 'scripts/construire-jeu.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'github-pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:jeu
      - name: Vérifier les HTML livrés
        run: git diff --exit-code -- dist/index.html dist/artefact.html
      - run: npm run test:jeu
      - name: Installer le navigateur de validation
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Vérifier le chemin de projet et le transfert de sauvegarde
        run: node jeu/tests/github-pages.cjs
      - name: Conserver les captures mobiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-mobile
          path: docs/captures/github-pages/
          if-no-files-found: ignore
      - name: Préparer le site autonome
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lire la configuration Pages existante
        uses: actions/configure-pages@v5
      - name: Publier le jeu
        id: deployment
        uses: actions/deploy-pages@v4
