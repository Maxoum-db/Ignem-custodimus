name: Export des données du Hub

# Lancement manuel uniquement (onglet Actions > Export des données du Hub > Run workflow).
# Décommenter « schedule » pour un export automatique chaque lundi à 5 h UTC.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 5 * * 1'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Tester les conversions
        run: npm run test:export

      - name: Exporter (lecture seule, contrôle vie privée)
        env:
          JEU_EXPORT_DB_URL: ${{ secrets.JEU_EXPORT_DB_URL }}
        run: npm run export:donnees

      - name: Enregistrer les données si elles ont changé
        run: |
          git config user.name "export-donnees"
          git config user.email "export-donnees@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Données : export du Hub $(date -u +%Y-%m-%d)"
            git push
          fi
